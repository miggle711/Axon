services:
  redis:
    image: redis:7-alpine
    container_name: axon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  queue:
    build:
      context: ./queue
    container_name: axon-queue
    command: ["-mode", "api", "-port", "8080", "-redis", "redis://redis:6379"]
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  engine:
    build:
      context: ./engine
    container_name: axon-engine
    command: ["-port", "8000", "-agents", "agents", "-queue", "http://queue:8080", "-redis", "redis://redis:6379"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      queue:
        condition: service_started

  worker:
    build:
      context: ./worker
    container_name: axon-worker
    command: ["-queue", "http://queue:8080", "-engine", "http://engine:8000"]
    # TAVILY_API_KEY / GROQ_API_KEY are optional (the worker warns and
    # nacks the affected job types if either is unset, see worker/cmd/main.go)
    # but needed for tool_call/tavily_search, llm_call, and supervisor
    # steps to actually run. Put them in a .env file next to this
    # compose file (see .env.example) rather than here, so real keys
    # never land in a committed file.
    env_file:
      - path: .env
        required: false
    depends_on:
      queue:
        condition: service_started
      engine:
        condition: service_started

volumes:
  redis_data:
