name: Engine & Worker Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'engine/**'
      - 'worker/**'
      - '.github/workflows/engine-worker-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'engine/**'
      - 'worker/**'

jobs:
  engine-tests:
    name: Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: |
          cd engine
          go test -v -race ./...

  engine-build:
    name: Engine Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        run: |
          cd engine
          go build ./...

  engine-lint:
    name: Engine Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: engine

  worker-build:
    name: Worker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        run: |
          cd worker
          go build ./...

  worker-lint:
    name: Worker Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: worker
