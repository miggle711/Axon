name: CLI Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cli/**'
      - 'engine/**'
      - '.github/workflows/cli-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cli/**'
      - 'engine/**'

jobs:
  cli-tests:
    name: CLI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: |
          cd cli
          go test -v -race ./...

  cli-build:
    name: CLI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        run: |
          cd cli
          go build ./...

  cli-lint:
    name: CLI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: cli
